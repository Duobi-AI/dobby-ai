<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dobby AI Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-background-canvas);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 520px;
      width: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .header img { width: 48px; height: 48px; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header .version { font-size: 13px; color: var(--color-text-version); margin-top: 2px; }
    .card {
      background: var(--color-surface-card);
      border: 1px solid var(--color-border-solid);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card p { font-size: 14px; color: var(--color-text-muted); line-height: 1.5; margin-bottom: 16px; }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--color-border-control);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--color-surface-input);
      color: var(--color-text-primary);
      font-family: 'SF Mono', Monaco, Consolas, monospace;
    }
    .input-group input:focus { border-color: var(--color-accent-interactive); box-shadow: 0 0 0 3px var(--color-focus-ring); }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--color-accent); color: var(--color-accent-contrast); }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-primary:disabled { background: var(--color-accent-disabled); cursor: not-allowed; }
    .btn-danger { background: var(--color-surface-card); color: var(--color-danger-interactive); border: 1px solid var(--color-danger-border); }
    .btn-danger:hover { background: var(--color-danger-surface-hover); }
    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.success { color: var(--color-success); }
    .status.error { color: var(--color-danger-interactive); }
    .status.info { color: var(--color-text-muted); }
    .current-key {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--color-surface-muted);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .current-key .key-value {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      color: var(--color-text-secondary);
    }
    .usage-info {
      background: var(--color-surface-info);
      border: 1px solid var(--color-accent-border-soft);
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--color-text-info);
    }
    .usage-info strong { font-weight: 600; }
    .divider { height: 1px; background: var(--color-border-solid); margin: 16px 0; }
    .steps { padding-left: 0; list-style: none; counter-reset: step; }
    .steps li { counter-increment: step; position: relative; padding-left: 28px; margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
    .steps li::before {
      content: counter(step);
      position: absolute; left: 0; top: 0;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--color-accent-interactive); color: var(--color-accent-contrast);
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .steps a { color: var(--color-accent-interactive); text-decoration: none; }
    .steps a:hover { text-decoration: underline; }
    .provider-tab {
      display: inline-block; padding: 6px 14px; font-size: 13px; font-weight: 500;
      border-radius: 8px 8px 0 0; cursor: pointer; border: 1px solid var(--color-border-tab); border-bottom: none;
      background: var(--color-surface-muted); color: var(--color-text-muted); margin-right: 4px;
    }
    .provider-tab.active { background: var(--color-surface-card); color: var(--color-text-primary); border-bottom: 1px solid var(--color-surface-card); margin-bottom: -1px; position: relative; z-index: 1; }
    .provider-content { border: 1px solid var(--color-border-solid); border-radius: 0 8px 8px 8px; padding: 16px; background: var(--color-surface-card); }
    .provider-panel { display: none; }
    .provider-panel.active { display: block; }
    .hint { font-size: 12px; color: var(--color-text-subtle); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="options.js"></script>
</body>
</html>
