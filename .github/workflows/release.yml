name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Validate version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          MANIFEST_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match package.json ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION validated"

      - name: Build extension
        run: npm run build

      - run: npm test

      - name: Package extension
        run: |
          cd dist && zip -r ../dobby-ai-${GITHUB_REF#refs/tags/}.zip .

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP_FILE="dobby-ai-$TAG.zip"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_FILE" --clobber
          else
            gh release create "$TAG" "$ZIP_FILE" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Check Chrome Web Store credentials
        id: chrome_creds
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          missing=0
          for name in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN CHROME_EXTENSION_ID CHROME_PUBLISHER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::$name is not configured; skipping Chrome Web Store publish."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Chrome Web Store
        if: steps.chrome_creds.outputs.can_publish == 'true'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail

          ZIP_FILE="dobby-ai-${GITHUB_REF#refs/tags/}.zip"

          # Get access token
          TOKEN_RESPONSE=$(curl -sS -f -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CHROME_CLIENT_ID" \
            -d "client_secret=$CHROME_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(node -e "
            const response = JSON.parse(process.argv[1]);
            if (!response.access_token) {
              console.error('OAuth response did not include an access token');
              process.exit(1);
            }
            process.stdout.write(response.access_token);
          " "$TOKEN_RESPONSE")

          # Upload zip to Chrome Web Store API v2.
          UPLOAD_STATUS=$(curl -sS -o /tmp/chrome-upload.json -w "%{http_code}" -X POST \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:upload" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            -T "$ZIP_FILE")
          if [ "$UPLOAD_STATUS" -lt 200 ] || [ "$UPLOAD_STATUS" -ge 300 ]; then
            cat /tmp/chrome-upload.json
            echo "::error::Chrome Web Store upload failed with HTTP $UPLOAD_STATUS"
            exit 1
          fi
          UPLOAD_STATE=$(node -e "
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('/tmp/chrome-upload.json', 'utf8'));
            if (response.error) {
              console.error('Chrome Web Store upload failed:', JSON.stringify(response.error));
              process.exit(1);
            }
            process.stdout.write(response.uploadState || '');
          ")

          # Large uploads may finish asynchronously. Poll the v2 status endpoint before publishing.
          MAX_UPLOAD_STATUS_ATTEMPTS=24
          for attempt in $(seq 1 "$MAX_UPLOAD_STATUS_ATTEMPTS"); do
            case "$UPLOAD_STATE" in
              SUCCEEDED) break ;;
              FAILED|NOT_FOUND)
                echo "::error::Chrome Web Store upload ended with state $UPLOAD_STATE"
                exit 1
                ;;
              IN_PROGRESS)
                if [ "$attempt" -eq "$MAX_UPLOAD_STATUS_ATTEMPTS" ]; then
                  echo "::error::Chrome Web Store upload is still in progress after $MAX_UPLOAD_STATUS_ATTEMPTS checks"
                  exit 1
                fi
                sleep 10
                STATUS_HTTP=$(curl -sS -o /tmp/chrome-status.json -w "%{http_code}" \
                  "https://chromewebstore.googleapis.com/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:fetchStatus" \
                  -H "Authorization: Bearer $ACCESS_TOKEN")
                if [ "$STATUS_HTTP" -lt 200 ] || [ "$STATUS_HTTP" -ge 300 ]; then
                  cat /tmp/chrome-status.json
                  echo "::error::Chrome Web Store status check failed with HTTP $STATUS_HTTP"
                  exit 1
                fi
                UPLOAD_STATE=$(node -e "
                  const fs = require('fs');
                  const response = JSON.parse(fs.readFileSync('/tmp/chrome-status.json', 'utf8'));
                  if (response.error) {
                    console.error('Chrome Web Store status check failed:', JSON.stringify(response.error));
                    process.exit(1);
                  }
                  process.stdout.write(response.lastAsyncUploadState || '');
                ")
                ;;
              *)
                echo "::error::Chrome Web Store returned unexpected upload state '${UPLOAD_STATE:-missing}'"
                cat /tmp/chrome-upload.json
                exit 1
                ;;
            esac
          done
          echo "Chrome Web Store upload completed successfully."

          is_retryable_publish_failure() {
            local http_status="$1"
            local response_file="$2"

            case "$http_status" in
              408|429|5??|000) return 0 ;;
            esac

            node - "$response_file" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          let response;

          try {
            response = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            process.exit(1);
          }

          const message = String(response?.error?.message || '');
          const retryable = /homepage url is not reachable|timeout while connecting|temporar|try again|internal error|backend error|rate limit/i.test(message);
          process.exit(retryable ? 0 : 1);
          NODE
          }

          # Publishing can fail transiently while Chrome validates listing URLs.
          MAX_PUBLISH_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_PUBLISH_ATTEMPTS"); do
            rm -f /tmp/chrome-publish.json
            CURL_EXIT=0
            PUBLISH_STATUS=$(curl -sS -o /tmp/chrome-publish.json -w "%{http_code}" -X POST \
              "https://chromewebstore.googleapis.com/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:publish" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Length: 0") || CURL_EXIT=$?
            if [ "$CURL_EXIT" -ne 0 ]; then
              PUBLISH_STATUS=000
            fi

            if [ -f /tmp/chrome-publish.json ]; then
              cat /tmp/chrome-publish.json
              echo
            fi

            if [ "$CURL_EXIT" -eq 0 ] && [ "$PUBLISH_STATUS" -ge 200 ] && [ "$PUBLISH_STATUS" -lt 300 ]; then
              node -e "
                const fs = require('fs');
                const response = JSON.parse(fs.readFileSync('/tmp/chrome-publish.json', 'utf8'));
                if (response.error) {
                  console.error('Chrome Web Store publish failed:', JSON.stringify(response.error));
                  process.exit(1);
                }
                if (!response.state) {
                  console.error('Chrome Web Store publish response did not include an item state');
                  process.exit(1);
                }
                console.log('Chrome Web Store accepted publish request; item state: ' + response.state);
                for (const warning of response.warningInfo?.warnings || []) {
                  console.warn('Chrome Web Store publish warning: ' + JSON.stringify(warning));
                }
                if (response.state === 'REJECTED' || response.state === 'CANCELLED') {
                  console.error('Chrome Web Store publish ended in state ' + response.state);
                  process.exit(1);
                }
              "
              break
            fi

            if [ "$attempt" -eq "$MAX_PUBLISH_ATTEMPTS" ] || ! is_retryable_publish_failure "$PUBLISH_STATUS" /tmp/chrome-publish.json; then
              echo "::error::Chrome Web Store publish failed with HTTP $PUBLISH_STATUS after $attempt attempt(s)"
              exit 1
            fi

            delay=$((attempt * 20))
            echo "::warning::Transient Chrome Web Store publish failure (HTTP $PUBLISH_STATUS). Retrying in ${delay}s ($attempt/$MAX_PUBLISH_ATTEMPTS)."
            sleep "$delay"
          done
