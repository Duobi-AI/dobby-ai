<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 268px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--color-text-primary);
    background: var(--color-background-page);
  }
  .theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--color-border-divider);
  }
  .theme-segment {
    display: flex;
    border: 1px solid var(--color-border-segment);
    border-radius: 6px;
    overflow: hidden;
    background: var(--color-surface-interactive);
  }
  .theme-option {
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--color-text-secondary);
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .theme-option:hover { color: var(--color-text-primary); }
  .theme-option.active {
    background: var(--color-accent);
    color: var(--color-white-hex);
    border-radius: 4px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 14px;
  }
  .app-logo {
    width: 24px;
    height: 24px;
    display: block;
  }
  .header-text { flex: 1; min-width: 0; }
  .version { font-size: 11px; color: var(--color-text-version); font-weight: 400; }
  .usage-card {
    border: 1px solid var(--color-border-interactive);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--color-surface-subtle);
  }
  .usage-card.ok { border-color: var(--color-success-border); }
  .usage-card.warning { border-color: var(--color-status-warning-border); background: var(--color-surface-warning); }
  .usage-card.danger { border-color: var(--color-status-danger-border); background: var(--color-surface-danger); }
  .usage-primary {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
  }
  .usage-secondary {
    margin-top: 4px;
    color: var(--color-text-muted);
    font-size: 11px;
    line-height: 1.4;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--color-border-divider);
  }
  .toggle-copy {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .status { font-size: 12px; color: var(--color-text-muted); }
  .toggle-label { font-size: 12px; color: inherit; }
  .state-badge {
    font-size: 11px;
    color: var(--color-text-muted);
  }
  .state-badge.on { color: var(--color-status-success); }
  .state-badge.off { color: var(--color-status-danger); }
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    cursor: pointer;
  }
  .toggle input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle input:focus-visible + .slider {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: var(--color-slider-background);
    border-radius: 10px;
    transition: background 0.2s;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    left: 2px;
    top: 2px;
    background: var(--color-white);
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle input:checked + .slider {
    background: var(--color-accent);
  }
  .toggle input:checked + .slider::before {
    transform: translateX(16px);
  }
  .settings-link {
    display: block;
    text-align: center;
    font-size: 11px;
    color: var(--color-accent-interactive);
    text-decoration: none;
    cursor: pointer;
  }
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--color-border-divider);
  }
  .quick-action {
    border: 1px solid var(--color-border-interactive);
    border-radius: 7px;
    background: var(--color-surface-interactive);
    color: var(--color-text-primary);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    min-height: 30px;
    padding: 5px 6px;
  }
  .quick-action:hover { background: var(--color-surface-interactive-hover); }
  .quick-action:disabled { cursor: not-allowed; opacity: 0.55; }
  .action-feedback {
    min-height: 14px;
    margin-top: -4px;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--color-text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <img class="app-logo" src="icons/dobby-logo-mark.svg" alt="Dobby AI">
    <div class="header-text">
      <div>Dobby AI</div>
      <div class="version" id="version"></div>
    </div>
  </div>
  <div class="usage-card" id="usage-card">
    <div class="usage-primary" id="usage-primary">Loading usage...</div>
    <div class="usage-secondary" id="usage-secondary"></div>
  </div>
  <div class="toggle-row">
    <div class="toggle-copy">
      <span class="toggle-label">Dobby on this browser</span>
      <span class="state-badge" id="status">On</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked aria-label="Enable or disable Dobby AI">
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-row">
    <div class="toggle-copy">
      <span class="toggle-label" title="Long-press anywhere to screenshot a region and ask AI about it.">Long-press screenshots</span>
      <span class="state-badge" id="screenshot-status">On</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="screenshot-enabled" checked aria-label="Enable or disable screenshot mode">
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-row">
    <div class="toggle-copy">
      <span class="toggle-label" title="Works in standard text fields (textarea). Gmail, Docs, and Notion support coming soon.">Text auto-suggest</span>
      <span class="state-badge" id="autosuggest-status">Off</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autosuggest-enabled" aria-label="Enable or disable auto-suggest">
      <span class="slider"></span>
    </label>
  </div>
  <div class="quick-actions">
    <button class="quick-action" id="history">History</button>
    <button class="quick-action" id="clear-history">Clear</button>
    <button class="quick-action" id="settings">Settings</button>
  </div>
  <div class="action-feedback" id="action-feedback"></div>
  <div class="theme-row">
    <span class="status">Theme</span>
    <div class="theme-segment" id="theme-segment" role="group" aria-label="Theme">
      <button class="theme-option active" data-theme="auto" aria-pressed="true">Auto</button>
      <button class="theme-option" data-theme="light" aria-pressed="false">Light</button>
      <button class="theme-option" data-theme="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
